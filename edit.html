<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עריכת האתר | הקבביה ביבניאל</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #080808; color: #f5efe6;
    font-family: 'Heebo', sans-serif; text-align: center; line-height: 1.6;
  }
  .card { width: min(420px, 100%); }
  img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #f59e0b; margin: 0 auto 18px; display: block; }
  h1 { font-family: 'Suez One', serif; font-weight: 400; font-size: 30px; color: #fcd34d; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: #cfc7ba; font-size: 17px; }
  .btn {
    display: block; width: 100%; min-height: 60px; margin-bottom: 12px;
    border-radius: 14px; border: 2px solid transparent; cursor: pointer;
    font: 800 20px 'Heebo', sans-serif; text-decoration: none; line-height: 56px;
  }
  .go { background: #1fa855; color: #fff; }
  .install { background: #2a2218; border-color: #f59e0b; color: #fcd34d; line-height: 1.3; padding: 14px; }
  .tip { font-size: 15px; color: #a79f93; margin: 18px 0 0; }
</style>
</head>
<body>
<div class="card">
  <img src="images/logo.jpg" alt="הקבביה ביבניאל">
  <h1>עריכת האתר</h1>
  <p>כאן נכנסים כדי לשנות את התפריט, המחירים, התמונות וההודעות.</p>
  <a class="btn go" href="index.html?edit=1">כניסה לעריכה</a>
  <button type="button" class="btn install" id="install" hidden>📲 הוסף למסך הבית כאפליקציה</button>
  <p class="tip" id="ios-tip" hidden>באייפון: לחץ על כפתור השיתוף (הריבוע עם החץ) ואז על "הוסף למסך הבית".</p>
</div>
<script>
(function () {
  /* כשנפתח כאפליקציה מותקנת - ישר למצב עריכה */
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  if (standalone) { location.replace('index.html?edit=1'); return; }

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }

  var deferred = null;
  var btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) document.getElementById('ios-tip').hidden = false;
})();
</script>
</body>
</html>
